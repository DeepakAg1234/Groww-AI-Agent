[project]
name = "groww-pulse"
version = "0.0.1"
description = "Weekly pulse from public Groww Google Play reviews."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "fastapi>=0.115",
    "scikit-learn>=1.5",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"groww_pulse" = ["theme_training.jsonl"]
"groww_pulse.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
